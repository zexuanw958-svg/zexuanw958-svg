<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="560" viewBox="0 0 1200 560" role="img" aria-labelledby="title desc">
  <title id="title">泽轩604 Signal Board</title>
  <desc id="desc">Animated editorial signal board for AI product manager intern, builder, and creator Zexuan604</desc>

  <defs>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#151515" stroke-opacity=".055" stroke-width="1"/>
    </pattern>
    <linearGradient id="paper" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fffdf7"/>
      <stop offset="1" stop-color="#eee8da"/>
    </linearGradient>
    <filter id="paperShadow" x="-20%" y="-20%" width="150%" height="150%">
      <feDropShadow dx="7" dy="7" stdDeviation="0" flood-color="#151515" flood-opacity="1"/>
    </filter>
    <clipPath id="headlineClip">
      <rect x="74" y="126" width="650" height="128" rx="4"/>
    </clipPath>
  </defs>

  <style>
    .sans { font-family: "Avenir Next", "Noto Sans SC", "PingFang SC", "Microsoft YaHei", sans-serif; }
    .serif { font-family: Georgia, "Noto Serif SC", "Songti SC", STSong, serif; }
    .mono { font-family: "SFMono-Regular", "JetBrains Mono", Menlo, Consolas, monospace; }
    .ink { fill: #151515; }
    .muted { fill: #6d6a62; }
    .red { fill: #b94533; }
    .blue { fill: #2a6f82; }
    .green { fill: #66784e; }

    .boot { opacity: 0; transform: translateY(8px); animation: boot 7.2s cubic-bezier(.16,1,.3,1) infinite; }
    .b1 { animation-delay: .10s; }
    .b2 { animation-delay: .38s; }
    .b3 { animation-delay: .66s; }
    .b4 { animation-delay: .94s; }
    .b5 { animation-delay: 1.22s; }
    .headline { transform: translateY(115px); animation: headline 7.2s cubic-bezier(.16,1,.3,1) infinite; }
    .cursor { animation: blink .86s steps(1) infinite; }
    .signal { offset-path: path("M 116 470 C 280 410 390 520 562 470 S 848 420 1082 470"); animation: signal 3.6s cubic-bezier(.45,0,.55,1) infinite; }
    .route { stroke-dasharray: 8 10; animation: route 18s linear infinite; }
    .pulse { transform-origin: center; animation: pulse 2.1s ease-in-out infinite; }
    .cta-arrow { animation: nudge 1.4s ease-in-out infinite; }

    @keyframes boot {
      0%, 5% { opacity: 0; transform: translateY(8px); }
      11%, 79% { opacity: 1; transform: translateY(0); }
      90%, 100% { opacity: 0; transform: translateY(-3px); }
    }
    @keyframes headline {
      0%, 8% { transform: translateY(115px); }
      17%, 82% { transform: translateY(0); }
      94%, 100% { transform: translateY(-115px); }
    }
    @keyframes blink { 0%, 48% { opacity: 1; } 49%, 100% { opacity: 0; } }
    @keyframes signal { 0% { offset-distance: 0%; } 100% { offset-distance: 100%; } }
    @keyframes route { to { stroke-dashoffset: -180; } }
    @keyframes pulse { 0%, 100% { opacity: .34; transform: scale(.86); } 50% { opacity: 1; transform: scale(1.08); } }
    @keyframes nudge { 0%, 100% { transform: translateX(0); } 50% { transform: translateX(7px); } }

    @media (prefers-reduced-motion: reduce) {
      .boot, .headline, .cursor, .signal, .route, .pulse, .cta-arrow { animation: none; opacity: 1; transform: none; }
      .headline { transform: translateY(0); }
    }
  </style>

  <rect x="8" y="8" width="1184" height="544" rx="22" fill="#151515"/>
  <rect x="1" y="1" width="1184" height="544" rx="22" fill="url(#paper)" stroke="#151515" stroke-width="2"/>
  <rect x="1" y="1" width="1184" height="544" rx="22" fill="url(#grid)"/>

  <path d="M1 68H1185" stroke="#151515" stroke-width="2"/>
  <rect x="24" y="23" width="66" height="28" rx="14" fill="#151515"/>
  <text x="57" y="42" class="mono" fill="#fffdf7" font-size="13" font-weight="800" text-anchor="middle">604</text>
  <text x="108" y="42" class="mono ink" font-size="13" font-weight="700" letter-spacing="1.6">ZEXUAN604 // PUBLIC BUILD LOG</text>
  <text x="1154" y="42" class="mono muted" font-size="12" text-anchor="end">SIGNAL: LIVE</text>
  <circle cx="1170" cy="37" r="5" class="green pulse"/>

  <text x="74" y="110" class="mono red boot b1" font-size="14" font-weight="800" letter-spacing="1.5">AI PRODUCT MANAGER INTERN · BUILDER · CREATOR</text>

  <g clip-path="url(#headlineClip)">
    <g class="headline">
      <text x="72" y="188" class="serif ink" font-size="62" font-weight="700">把 AI 折腾成</text>
      <text x="72" y="246" class="serif ink" font-size="62" font-weight="700">能用的东西<tspan class="red">。</tspan></text>
    </g>
  </g>

  <text x="75" y="288" class="sans muted boot b2" font-size="19">把真实使用中的麻烦，做成工具、Skills 和小产品。</text>
  <text x="75" y="320" class="sans muted boot b3" font-size="19">再把试出来的东西，讲到人能听懂。</text>

  <rect x="760" y="112" width="354" height="234" rx="10" fill="#fffdf7" stroke="#151515" stroke-width="2" filter="url(#paperShadow)"/>
  <circle cx="788" cy="139" r="6" fill="#b94533"/>
  <circle cx="808" cy="139" r="6" fill="#b78a35"/>
  <circle cx="828" cy="139" r="6" fill="#66784e"/>
  <text x="1090" y="143" class="mono muted" font-size="11" text-anchor="end">604@lab ~ % whoami</text>
  <path d="M760 160H1114" stroke="#151515" stroke-opacity=".14"/>

  <text x="786" y="194" class="mono blue boot b1" font-size="14" font-weight="800">[BUILD]</text>
  <text x="866" y="194" class="mono ink boot b1" font-size="14">Agent Skills / tools</text>
  <text x="786" y="226" class="mono red boot b2" font-size="14" font-weight="800">[TEST]</text>
  <text x="866" y="226" class="mono ink boot b2" font-size="14">real tasks / bad cases</text>
  <text x="786" y="258" class="mono green boot b3" font-size="14" font-weight="800">[SHIP]</text>
  <text x="866" y="258" class="mono ink boot b3" font-size="14">GitHub / apps / web</text>
  <text x="786" y="290" class="mono blue boot b4" font-size="14" font-weight="800">[TELL]</text>
  <text x="866" y="290" class="mono ink boot b4" font-size="14">Douyin / Bilibili / RED</text>
  <text x="786" y="326" class="mono red boot b5" font-size="13">READY TO MAKE SOMETHING USEFUL<tspan class="cursor">_</tspan></text>

  <path d="M74 382H1114" stroke="#151515" stroke-opacity=".22"/>
  <text x="74" y="410" class="mono muted" font-size="12" letter-spacing="1.6">CURRENT LOOP</text>

  <path class="route" d="M116 470C280 410 390 520 562 470S848 420 1082 470" fill="none" stroke="#151515" stroke-width="2" stroke-opacity=".52"/>
  <circle class="signal red" cx="0" cy="0" r="7"/>

  <g class="boot b1">
    <circle cx="116" cy="470" r="12" fill="#fffdf7" stroke="#151515" stroke-width="2"/>
    <text x="116" y="510" class="mono ink" font-size="13" font-weight="800" text-anchor="middle">BUILD</text>
  </g>
  <g class="boot b2">
    <circle cx="410" cy="470" r="12" fill="#fffdf7" stroke="#151515" stroke-width="2"/>
    <text x="410" y="510" class="mono ink" font-size="13" font-weight="800" text-anchor="middle">TEST</text>
  </g>
  <g class="boot b3">
    <circle cx="700" cy="470" r="12" fill="#fffdf7" stroke="#151515" stroke-width="2"/>
    <text x="700" y="510" class="mono ink" font-size="13" font-weight="800" text-anchor="middle">SHIP</text>
  </g>
  <g class="boot b4">
    <circle cx="996" cy="470" r="12" fill="#fffdf7" stroke="#151515" stroke-width="2"/>
    <text x="996" y="510" class="mono ink" font-size="13" font-weight="800" text-anchor="middle">EXPLAIN</text>
  </g>

  <text x="1114" y="522" class="mono red" font-size="12" font-weight="800" text-anchor="end">OPEN THE 604 LAB</text>
  <text x="1125" y="522" class="mono red cta-arrow" font-size="16">→</text>
</svg>
